name: Build and Deploy

on:
  push:
    branches: [dev]

jobs:
  build:
    permissions: write-all
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata from repository
        uses: docker/metadata-action@v3
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          
      - name: Build and push to ghcr.io
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "DEPLOY_URL=https://staging.polyglot-edu.com"
            "BACK_URL=https://polyglot-api-staging.polyglot-edu.com"
            "TEST_MODE=true"
            "AUTH0_SECRET=${{ secrets.AUTH0_SECRET }}"
            "AUTH0_ISSUER_BASE_URL=${{ secrets.AUTH0_ISSUER_BASE_URL }}"
            "AUTH0_CLIENT_ID=${{ secrets.AUTH0_CLIENT_ID }}"
            "AUTH0_CLIENT_SECRET=${{ secrets.AUTH0_CLIENT_SECRET }}"
            "AUTH0_AUDIENCE=${{ secrets.AUTH0_AUDIENCE }}"
            "AUTH0_SCOPE=${{ secrets.AUTH0_SCOPE }}"
            "APIKEY=${{ secrets.APIKEY }}"
            "SETUPMODEL=${{ secrets.SETUPMODEL }}"
            "AIGENERATION_URL=https://skapi.polyglot-edu.com"
          no-cache: true
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          
      - name: Push to ghcr.io with retries
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 5
          max_attempts: 5
          command: echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r i; do echo "Pushing $i"; docker push $i; done
          
      - name: Install Helm 3
        run: |
          curl https://get.helm.sh/helm-v3.9.4-linux-amd64.tar.gz -o helm-v3.9.4-linux-amd64.tar.gz
          tar -zxvf helm-v3.9.4-linux-amd64.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm3
          helm3 version

      - name: Deploy to Kubernetes cluster (with pending release fix)
        run: |
          echo "$KUBECONFIG_FILE" > ./kubeconfig.yml
          export KUBECONFIG=./kubeconfig.yml

          echo "🔍 Checking if Helm release is stuck..."
          release_status=$(helm3 status polyglot-webapp --namespace polyglot-webapp 2>&1 || true)
          if echo "$release_status" | grep -q "pending"; then
            echo "🧹 Uninstalling stuck release..."
            helm3 uninstall polyglot-webapp --namespace polyglot-webapp || true
          fi

          echo "🚀 Running Helm upgrade..."
          helm3 upgrade polyglot-webapp charts \
            --install \
            --wait \
            --atomic \
            --timeout 5m \
            --namespace=polyglot-webapp \
            --create-namespace \
            --set=app.name=polyglot-webapp \
            --values=./values-override.yml
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'

      - name: Helm Deploy for node-editor-staging (with values)
        uses: daviFrag/helm@master
        with:
          release: 'node-editor-staging'
          namespace: 'node-editor-staging'
          chart: 'charts'
          token: '${{ github.token }}'
          values: |
            url: staging.polyglot-edu.com
            cfOriginKey: ${{ secrets.CFORIGIN }}
            dockerconfigjson: ${{ secrets.DOCKER_CONFIG }}
            image:
              repository: ${{ steps.meta.outputs.tags }}
            env:
              authSecret: ${{ secrets.AUTH0_SECRET }}
              authIssuerUrl: ${{ secrets.AUTH0_ISSUER_BASE_URL }}
              authClientId: ${{ secrets.AUTH0_CLIENT_ID }}
              authClientSecret: ${{ secrets.AUTH0_CLIENT_SECRET }}
              authAudience: ${{ secrets.AUTH0_AUDIENCE }}
              authScope: ${{ secrets.AUTH0_SCOPE }}
              apiKey: ${{ secrets.APIKEY }}
              setupModel: ${{ secrets.SETUPMODEL }}
              aiGenerationUrl: https://skapi.polyglot-edu.com
              backUrl: https://polyglot-api-staging.polyglot-edu.com
              testMode: false
        env:
          KUBECONFIG_FILE: '${{ secrets.KUBECONFIG }}'
